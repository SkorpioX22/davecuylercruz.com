<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>notnt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: #000;
        color: #fff;
        font-family: "JetBrains Mono", monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .teaser {
        text-align: center;
        max-width: 48rem;
      }

      #type-line {
        font-size: clamp(1.4rem, 4vw, 2.4rem);
        font-weight: 500;
        line-height: 1.35;
      }

      #type-line::after {
        content: "";
        display: inline-block;
        width: 0.6em;
        height: 1em;
        margin-left: 0.15em;
        vertical-align: text-bottom;
        background: #fff;
        animation: blink 1s steps(1) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .sub {
        margin-top: 1.25rem;
        font-size: clamp(0.8rem, 2.2vw, 1rem);
        font-weight: 400;
        opacity: 0;
        transition: opacity 0.8s ease;
      }

      .sub.visible {
        opacity: 1;
      }

      .sub a {
        color: #fff;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .sub a:hover {
        color: #888;
      }
    </style>
  </head>
  <body>
    <main class="teaser">
      <p id="type-line"></p>
      <p class="sub">
        <a href="https://notnt.carrd.co" target="_blank" rel="noopener">notnt.carrd.co</a>
        is moving here and will soon be retired.
      </p>
    </main>

    <script>
      const text = "the new notnt is coming.";
      const el = document.getElementById("type-line");
      let i = 0;

      function type() {
        if (i < text.length) {
          el.textContent = text.slice(0, ++i);
          setTimeout(type, 70);
        } else {
          document.querySelector(".sub").classList.add("visible");
        }
      }

      type();
    </script>
  </body>
</html>
