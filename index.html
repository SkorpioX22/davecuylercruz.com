<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>notnt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: #000;
        color: #fff;
        font-family: "JetBrains Mono", monospace;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 2rem;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .teaser {
        text-align: center;
        max-width: 48rem;
      }

      #type-line {
        font-size: clamp(1.4rem, 4vw, 2.4rem);
        font-weight: 500;
        line-height: 1.5;
      }

      #type-line::after {
        content: "";
        display: inline-block;
        width: 0.6em;
        height: 1em;
        margin-left: 0.15em;
        vertical-align: text-bottom;
        background: #fff;
        animation: blink 1s steps(1) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .reveal {
        opacity: 0;
        transition: opacity 0.8s ease;
      }

      .reveal.visible {
        opacity: 1;
      }

      .cta {
        margin-top: 2.25rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
      }

      .btn {
        display: inline-block;
        padding: 0.65rem 1.6rem;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.95rem;
        text-decoration: none;
        color: #fff;
        border: 1px solid transparent;
        border-radius: 6px;
        background:
          linear-gradient(#000, #000) padding-box,
          var(--grad) border-box;
        transition: color 0.25s ease, transform 0.25s ease;
      }

      .btn:hover {
        background: var(--grad);
        color: #000;
        transform: scale(1.04);
      }

      .btn.instagram {
        --grad: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
      }

      .btn.github {
        --grad: linear-gradient(135deg, #f0f6fc, #8b949e);
      }

      .btn.fpv {
        --grad: linear-gradient(135deg, #38bdf8, #6366f1);
      }

      .sub {
        margin-top: 1.75rem;
        font-size: clamp(0.8rem, 2.2vw, 1rem);
        font-weight: 400;
      }

      .sub a {
        color: #fff;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .sub a:hover {
        color: #888;
      }

      footer {
        text-align: center;
        font-size: 0.7rem;
        color: rgba(255, 255, 255, 0.35);
        padding-top: 1.5rem;
      }
          .topnav {
        text-align: center;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.35);
        padding-bottom: 1.25rem;
      }
      .topnav a {
        color: rgba(255, 255, 255, 0.55);
        text-decoration: none;
        margin: 0 0.6rem;
      }
      .topnav a:hover {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <nav class="topnav"><a href="./">home</a><a href="type/">type</a><a href="old/">old</a><a href="EFU/">efu</a></nav>

    <main>
      <div class="teaser">
        <p id="type-line" dir="auto"></p>

        <div class="cta reveal">
          <a class="btn instagram" href="https://www.instagram.com/c_users_nt/" target="_blank" rel="noopener">Instagram</a>
          <a class="btn github" href="https://github.com/SkorpioX22" target="_blank" rel="noopener">GitHub</a>
          <a class="btn fpv" href="https://novafpv.carrd.co" target="_blank" rel="noopener">FPV</a>
        </div>

        <p class="sub reveal">
          <a href="https://notnt.carrd.co" target="_blank" rel="noopener">notnt.carrd.co</a>
          is moving here and will soon be retired.
        </p>
      </div>
    </main>

    <footer>site version 0.6</footer>

    <script>
      // "hi, I'm Dave." in ~60 major languages, shuffled and cycled forever.
      const languages = [
        "hi, I'm Dave.", // English
        "hola, soy Dave.", // Spanish
        "salut, je suis Dave.", // French
        "hallo, ich bin Dave.", // German
        "ciao, sono Dave.", // Italian
        "olá, eu sou o Dave.", // Portuguese
        "hallo, ik ben Dave.", // Dutch
        "привет, я Дэйв.", // Russian
        "привіт, я Дейв.", // Ukrainian
        "cześć, jestem Dave.", // Polish
        "ahoj, jsem Dave.", // Czech
        "ahoj, som Dave.", // Slovak
        "salut, sunt Dave.", // Romanian
        "szia, Dave vagyok.", // Hungarian
        "γεια, είμαι ο Ντέιβ.", // Greek
        "merhaba, ben Dave.", // Turkish
        "hej, jag är Dave.", // Swedish
        "hei, jeg er Dave.", // Norwegian
        "hej, jeg er Dave.", // Danish
        "hei, olen Dave.", // Finnish
        "halló, ég er Dave.", // Icelandic
        "你好，我是戴夫。", // Mandarin
        "你好，我係 Dave。", // Cantonese
        "こんにちは、デイブです。", // Japanese
        "안녕하세요, 저는 데이브예요.", // Korean
        "xin chào, tôi là Dave.", // Vietnamese
        "สวัสดีครับ ผมชื่อเดฟ", // Thai
        "halo, saya Dave.", // Indonesian
        "hai, saya Dave.", // Malay
        "hi, ako si Dave.", // Filipino
        "नमस्ते, मैं डेव हूँ।", // Hindi
        "হাই, আমি ডেভ।", // Bengali
        "ہائے، میں ڈیو ہوں۔", // Urdu
        "ਹਾਇ, ਮੈਂ ਡੇਵ ਹਾਂ।", // Punjabi
        "हाय, मी डेव्ह.", // Marathi
        "હાય, હું ડેવ છું.", // Gujarati
        "வணக்கம், நான் டேவ்.", // Tamil
        "హాయ్, నేను డేవ్.", // Telugu
        "ನಮಸ್ಕಾರ, ನಾನು ಡೇವ್.", // Kannada
        "ഹായ്, ഞാൻ ഡേവ് ആണ്.", // Malayalam
        "ආයුබෝවන්, මම ඩේව්.", // Sinhala
        "नमस्ते, म डेभ हुँ।", // Nepali
        "မင်္ဂလာပါ၊ ကျွန်တော် Dave ပါ။", // Burmese
        "ជំរាបសួរ, ខ្ញុំឈ្មោះ Dave។", // Khmer
        "ສະບາຍດີ, ຂ້ອຍຊື່ Dave.", // Lao
        "مرحبًا، أنا ديف.", // Arabic
        "שלום, אני דייב.", // Hebrew
        "سلام، من دیو هستم.", // Persian
        "habari, mimi ni Dave.", // Swahili
        "sawubona, nginguDave.", // Zulu
        "sannu, ni Dave ne.", // Hausa
        "bawo, èmi ni Dave.", // Yoruba
        "ሰላም፣ እኔ Dave ነኝ።", // Amharic
        "salaam, waxaan ahay Dave.", // Somali
        "hallo, ek is Dave.", // Afrikaans
        "dia duit, is mise Dave.", // Irish
        "helo, Dave ydw i.", // Welsh
        "hola, sóc en Dave.", // Catalan
        "kaixo, ni Dave naiz.", // Basque
        "përshëndetje, unë jam Dave.", // Albanian
        "здраво, ја сам Дејв.", // Serbian
        "bok, ja sam Dave.", // Croatian
        "živjo, sem Dave.", // Slovenian
        "labas, aš Deivas.", // Lithuanian
        "sveiki, es esmu Deivs.", // Latvian
        "tere, ma olen Dave.", // Estonian
        "გამარჯობა, მე დეივ ვარ.", // Georgian
        "բարև, ես Դեյվն եմ.", // Armenian
        "salam, mən Deyvəm.", // Azerbaijani
        "сәлем, мен Дэйвпін.", // Kazakh
        "salom, men Deyvman.", // Uzbek
        "сайн уу, би Дэйв.", // Mongolian
        "прывітанне, я Дэйв.", // Belarusian
        "здравей, аз съм Дейв.", // Bulgarian
        "здраво, јас сум Дејв.", // Macedonian
        "zdravo, ja sam Dave.", // Bosnian
      ];

      const el = document.getElementById("type-line");
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      async function type(text, speed = 70) {
        for (let i = 0; i <= text.length; i++) {
          el.textContent = text.slice(0, i);
          await sleep(speed);
        }
      }

      async function erase(speed = 35) {
        while (el.textContent.length > 0) {
          el.textContent = el.textContent.slice(0, -1);
          await sleep(speed);
        }
      }

      // Fisher-Yates shuffle.
      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      (async () => {
        // Start with English, reveal the rest of the page once it's typed.
        await type(languages[0]);
        document.querySelectorAll(".reveal").forEach((n) => n.classList.add("visible"));
        await sleep(1500);
        await erase();

        // Cycle through all languages (including English again) in random order.
        const order = shuffle(languages.slice());
        while (true) {
          for (const text of order) {
            await type(text);
            await sleep(1500);
            await erase();
            await sleep(500);
          }
        }
      })();
    </script>
  </body>
</html>
