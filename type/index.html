<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>type — notnt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: #000;
        color: #fff;
        font-family: "JetBrains Mono", monospace;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 2rem;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .wrap {
        max-width: 52rem;
        width: 100%;
        text-align: center;
      }

      .meta {
        font-size: 0.85rem;
        color: rgba(255, 255, 255, 0.45);
        margin-bottom: 2.5rem;
      }

      .words {
        font-size: clamp(1.1rem, 3vw, 1.6rem);
        line-height: 2.1;
        margin-bottom: 2.5rem;
        min-height: 4.5em;
      }

      .word {
        display: inline-block;
        color: rgba(255, 255, 255, 0.25);
      }

      /* gap between words = the space you have to type */
      .word:not(:last-child) {
        margin-right: 0.55em;
      }

      .word .c.ok {
        color: #fff;
      }

      .word .c.bad {
        color: #ff3b30;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .word.current {
        color: rgba(255, 255, 255, 0.25);
      }

      .caret {
        display: inline-block;
        width: 2px;
        height: 1.05em;
        margin-left: 2px;
        vertical-align: -0.15em;
        background: #fff;
        animation: blink 1s steps(1) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .hint {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.4);
      }

      kbd {
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 4px;
        padding: 0 0.35em;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.75rem;
      }

      .results .wpm {
        font-size: clamp(3rem, 8vw, 4.5rem);
        font-weight: 700;
        line-height: 1.1;
      }

      .results .r-row {
        margin-top: 0.9rem;
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.7);
        display: flex;
        justify-content: center;
        gap: 2.5rem;
        flex-wrap: wrap;
      }

      .results .r-row b {
        color: #fff;
        font-weight: 500;
      }

      .results .hint {
        margin-top: 2rem;
      }

      footer {
        text-align: center;
        font-size: 0.7rem;
        color: rgba(255, 255, 255, 0.35);
        padding-top: 1.5rem;
      }

      footer a {
        color: rgba(255, 255, 255, 0.35);
        text-decoration: none;
      }

      footer a:hover {
        color: #fff;
      }
          .topnav {
        text-align: center;
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.35);
        padding-bottom: 1.25rem;
      }
      .topnav a {
        color: rgba(255, 255, 255, 0.55);
        text-decoration: none;
        margin: 0 0.6rem;
      }
      .topnav a:hover {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <nav class="topnav"><a href="../index.html">home</a><a href=".">type</a><a href="../old/index.html">old</a></nav>

    <main>
      <div class="wrap">
        <p class="meta">daily typing test — <span id="date"></span></p>

        <div class="words" id="words"></div>

        <p class="hint" id="hint">type all 10 words — spaces count! the timer begins on your first keystroke</p>

        <div class="results" id="results" hidden>
          <div class="wpm"><span id="wpm">0</span> wpm</div>
          <div class="r-row">
            <span>error rate: <b id="err">0%</b></span>
            <span>time: <b id="time">0.0s</b></span>
            <span>keystrokes: <b id="keys">0</b></span>
          </div>
          <p class="hint">press <kbd>enter</kbd> to try again — same words, new day</p>
        </div>
      </div>
    </main>

    <footer>
      <a href="../index.html">← home</a> &nbsp;|&nbsp; site version 0.5
    </footer>

    <script>
      // ~230-word bank, letters only (no apostrophes/hyphens).
      const RAW = [
        "tune", "note", "wave", "code", "glow", "beam", "loop", "zoom", "flow", "fade",
        "pulse", "blend", "trim", "trace", "warp", "scope", "grip", "drift", "glide", "hover",
        "rotor", "servo", "frame", "prop", "wing", "tail", "stick", "bank", "roll", "yaw",
        "pitch", "crash", "land", "launch", "climb", "dive", "race", "track", "lap", "finish",
        "boost", "speed", "signal", "range", "link", "bind", "fail", "safe", "goggle", "camera",
        "lens", "shutter", "sensor", "pixel", "focus", "flash", "noise", "grain", "light", "shadow",
        "color", "black", "white", "red", "blue", "green", "sound", "music", "beat", "rhythm",
        "melody", "synth", "sample", "mix", "master", "studio", "album", "record", "stream", "upload",
        "download", "playlist", "artist", "singer", "band", "concert", "stage", "crowd", "poster", "sticker",
        "print", "model", "design", "build", "paint", "sketch", "draw", "craft", "maker", "solder",
        "wire", "board", "chip", "power", "battery", "charge", "voltage", "current", "flight", "pilot",
        "airspace", "weather", "forecast", "wind", "storm", "rain", "cloud", "sunset", "sunrise", "horizon",
        "mountain", "valley", "river", "ocean", "beach", "island", "forest", "desert", "trail", "summit",
        "ridge", "canyon", "coast", "harbor", "bridge", "street", "city", "town", "village", "market",
        "temple", "museum", "gallery", "library", "garden", "park", "plaza", "avenue", "alley", "corner",
        "crosswalk", "bicycle", "helmet", "saddle", "pedal", "brake", "chain", "wheel", "tire", "pump",
        "repair", "commute", "cruise", "wander", "explore", "discover", "adventure", "journey", "quest", "mission",
        "project", "prototype", "version", "update", "release", "feature", "fix", "bug", "cache", "server",
        "client", "token", "secret", "backup", "restore", "encode", "decode", "encrypt", "decrypt", "hash",
        "salt", "random", "unique", "daily", "weekly", "monthly", "yearly", "today", "tomorrow", "yesterday",
        "morning", "evening", "midnight", "noon", "hour", "minute", "second", "moment", "instant", "soon",
        "later", "never", "always", "sometimes", "often", "rarely", "maybe", "perhaps", "surely", "truly",
        "deeply", "loudly", "quietly", "quickly", "slowly", "gently", "softly", "brightly", "darkly", "forever",
      ];

      const WORDS = [...new Set(RAW)]; // safety net, order-preserving

      function hashString(s) {
        let h = 1779033703 ^ s.length;
        for (let i = 0; i < s.length; i++) {
          h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
          h = (h << 13) | (h >>> 19);
        }
        h = Math.imul(h ^ (h >>> 16), 2246822507);
        h = Math.imul(h ^ (h >>> 13), 3266489909);
        return (h ^= h >>> 16) >>> 0;
      }

      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function dailyWords(dateStr) {
        const rand = mulberry32(hashString(dateStr));
        const pool = WORDS.slice();
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        return pool.slice(0, 10);
      }

      const now = new Date();
      const dateStr =
        now.getFullYear() +
        "-" +
        String(now.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(now.getDate()).padStart(2, "0");
      document.getElementById("date").textContent = dateStr;

      const words = dailyWords(dateStr);
      // The full text the user has to reproduce, spaces included:
      // "w0 w1 w2 ... w9"
      const full = words.join(" ");

      const wordsEl = document.getElementById("words");
      const hintEl = document.getElementById("hint");
      const resultsEl = document.getElementById("results");

      let typedChars = new Array(full.length); // per-position typed char (sparse)
      let typedPos = 0;
      let started = false;
      let finished = false;
      let startTime = 0;
      let totalKeys = 0;
      let errors = 0;

      // Number of characters (letters + spaces) before word wi starts.
      function charsBefore(wordIdx) {
        let n = 0;
        for (let i = 0; i < wordIdx; i++) n += words[i].length + 1;
        return n;
      }

      // The word the caret is currently in.
      function currentWordIndex() {
        let pos = 0;
        for (let i = 0; i < words.length; i++) {
          if (typedPos <= pos + words[i].length) return i;
          pos += words[i].length + 1;
        }
        return words.length - 1;
      }

      function render() {
        const cur = currentWordIndex();
        wordsEl.innerHTML = "";
        words.forEach((w, wi) => {
          const before = charsBefore(wi);
          const span = document.createElement("span");
          span.className = "word" + (wi === cur ? " current" : "");
          for (let ci = 0; ci < w.length; ci++) {
            const c = document.createElement("span");
            c.className = "c";
            c.textContent = w[ci];
            const g = before + ci;
            if (g < typedPos) {
              c.classList.add(typedChars[g] === w[ci] ? "ok" : "bad");
            }
            span.appendChild(c);
          }
          if (wi === cur) {
            const caret = document.createElement("span");
            caret.className = "caret";
            const local = typedPos - before;
            const chars = span.querySelectorAll(".c");
            if (local < chars.length) {
              span.insertBefore(caret, chars[local]);
            } else {
              span.appendChild(caret);
            }
          }
          wordsEl.appendChild(span);
        });
      }

      function finish() {
        finished = true;
        const ms = performance.now() - startTime;
        const minutes = ms / 60000;
        const correct = totalKeys - errors;
        const wpm = minutes > 0 ? Math.round(correct / 5 / minutes) : 0;
        const errRate = totalKeys > 0 ? (errors / totalKeys) * 100 : 0;
        document.getElementById("wpm").textContent = wpm;
        document.getElementById("err").textContent = errRate.toFixed(1) + "%";
        document.getElementById("time").textContent = (ms / 1000).toFixed(1) + "s";
        document.getElementById("keys").textContent = totalKeys;
        resultsEl.hidden = false;
        hintEl.hidden = true;
      }

      function restart() {
        typedChars = new Array(full.length);
        typedPos = 0;
        started = false;
        finished = false;
        totalKeys = 0;
        errors = 0;
        resultsEl.hidden = true;
        hintEl.hidden = false;
        render();
      }

      window.addEventListener("keydown", (e) => {
        if (finished) {
          if (e.key === "Enter") restart();
          return;
        }
        if (e.ctrlKey || e.metaKey || e.altKey) return;

        if (e.key === "Backspace") {
          e.preventDefault();
          if (typedPos > 0) {
            typedPos--;
            typedChars[typedPos] = undefined;
          }
          render();
          return;
        }

        if (e.key === " ") e.preventDefault();

        // Printable characters, including the space between words.
        if (e.key.length === 1) {
          if (!started) {
            started = true;
            startTime = performance.now();
          }
          const ch = e.key;
          totalKeys++;
          if (ch !== full[typedPos]) errors++;
          typedChars[typedPos] = ch;
          typedPos++;
          if (typedPos === full.length) finish();
          render();
        }
      });

      render();
    </script>
  </body>
</html>
